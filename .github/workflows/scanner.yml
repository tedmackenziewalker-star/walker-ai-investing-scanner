name: Walker AI Investing - Engine 01

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner
        run: python scanner.py > scanner_run.log 2>&1
      - name: Health report
        run: python scan_health.py
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: walker-ai-scan
          path: |
            scanner_results.csv
            scanner_failures.csv
            scanner_run.log
          retention-days: 7
      - name: Publish latest verified results
        if: github.ref == 'refs/heads/main' && success()
        run: |
          test -s scanner_results.csv
          mkdir -p data
          cp scanner_results.csv data/latest_scan.csv
          git add -- data/latest_scan.csv
          if git diff --cached --quiet; then
            echo "Latest verified scan is unchanged; no commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update latest verified 200-week MA scan"
            git push origin HEAD:main
          fi
