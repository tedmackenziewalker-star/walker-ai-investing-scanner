name: Walker AI Investing - Engine 01

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner
        run: python scanner.py > scanner_run.log 2>&1
      - name: Health report
        run: python scan_health.py
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: walker-ai-scan
          path: |
            scanner_results.csv
            scanner_failures.csv
            scanner_run.log
          retention-days: 7
